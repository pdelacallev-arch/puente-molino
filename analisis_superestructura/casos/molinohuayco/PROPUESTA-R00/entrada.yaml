# Caso derivado de MODIFICADO-R01/entrada.yaml.
# Propuesta de ajuste de la sección de la viga principal metálica:
#   - altura_alma: 1755 -> 1743 mm en los seis segmentos
#   - espesor_alma: 16 -> 19 mm en los seis segmentos
#   - espesor_ala_superior: 25 -> 32 mm en los seis segmentos
#   - losa.ancho_haunch: 0.45 -> 0.50 m
# Motivo: en MODIFICADO-R01 la deflexión vehicular y peatonal de Servicio I
# (límite L/1000) resultó D/C = 1.027 en la viga exterior (51.36 mm > 50.00 mm)
# y la ductilidad Dp/Dt alcanzó 0.977. El incremento del espesor del alma
# (16 -> 19 mm) y del ancho del haunch busca resolver ambas condiciones.
# La reducción de altura del alma (1755 -> 1743 mm) compensa el aumento del ala
# superior (32 mm) para mantener el canto total constante de 1825 mm en centro de luz.
# El resto de los datos de entrada se conserva sin cambios respecto de MODIFICADO-R01.
proyecto:
  id: puente-molinohuayco
  nombre: Puente Molinohuayco - piloto de vigas principales (PROPUESTA-R00)
  revision: PROPUESTA-R00
  responsable: Pendiente de conciliación del expediente
  sistema_unidades: SI
geometria:
  luz: 50.0
  numero_vigas: 3
  separacion_vigas: 2.0
  ancho_calzada: 4.0
  ancho_veredas_total: 2.0
  ancho_tablero: 6.0
  voladizo_exterior: 1.0
  distancia_borde_calzada_viga_exterior: 0.0
  numero_carriles: 1
losa: {espesor: 0.20, haunch: 0.05, ancho_haunch: 0.50, factor_largo_plazo: 3.0}
materiales:
  concreto: {fc: 27.46, peso_unitario: 24.0}
  acero_estructural: {fy: 345.0, fu: 450.0, es: 200000.0, peso_unitario: 77.0, grado: ASTM A709 Gr. 50}
  acero_refuerzo: {fy: 420.0, es: 200000.0}
viga:
  categoria_fatiga: C
  alma_rigidizada: true
  separacion_rigidizadores: 1.5
  segmentos:
    # Distribución simétrica A-B-C-C-B-A. Posiciones de soldadura
    # provisionales, pendientes de verificación contra el plano acotado.
    #Ala superior 500x32 mm y alma de 19 mm.
    - {nombre: A-I, x_inicio: 0.0, x_fin: 8.0, altura_alma: 1743, espesor_alma: 19, ancho_ala_superior: 500, espesor_ala_superior: 32, ancho_ala_inferior: 600, espesor_ala_inferior: 25}
    - {nombre: B-I, x_inicio: 8.0, x_fin: 16.5, altura_alma: 1743, espesor_alma: 19, ancho_ala_superior: 500, espesor_ala_superior: 32, ancho_ala_inferior: 600, espesor_ala_inferior: 32}
    - {nombre: C-I, x_inicio: 16.5, x_fin: 25.0, altura_alma: 1743, espesor_alma: 19, ancho_ala_superior: 500, espesor_ala_superior: 32, ancho_ala_inferior: 600, espesor_ala_inferior: 50}
    - {nombre: C-D, x_inicio: 25.0, x_fin: 33.5, altura_alma: 1743, espesor_alma: 19, ancho_ala_superior: 500, espesor_ala_superior: 32, ancho_ala_inferior: 600, espesor_ala_inferior: 50}
    - {nombre: B-D, x_inicio: 33.5, x_fin: 42.0, altura_alma: 1743, espesor_alma: 19, ancho_ala_superior: 500, espesor_ala_superior: 32, ancho_ala_inferior: 600, espesor_ala_inferior: 32}
    - {nombre: A-D, x_inicio: 42.0, x_fin: 50.0, altura_alma: 1743, espesor_alma: 19, ancho_ala_superior: 500, espesor_ala_superior: 32, ancho_ala_inferior: 600, espesor_ala_inferior: 25}
arriostramiento:
  posiciones: [0, 6.25, 12.5, 18.75, 25, 31.25, 37.5, 43.75, 50]
  confirmado: true
construccion:
  apuntalada: false
  # Construcción NO apuntalada: la viga de acero sola soporta su peso propio y el
  # del concreto fresco (losa + haunch) antes de que actúe la sección compuesta.
  carga_construccion: 0.0
  incluir_losa_fresca: true
  incluir_peso_propio_viga: true
cargas:
  # Acero adicional previo a la acción compuesta: conectores, rigidizadores
  # y peso equivalente de diafragmas. No se añaden placas de empalme porque
  # se confirmó que no existen.
  dc_no_compuesta_adicional: {interior: 1.24, exterior: 0.94}
  # Recrecido de vereda y baranda colocados después de activar la sección
  # compuesta. El haunch se calcula automáticamente con los datos de la losa.
  dc_compuesta: {interior: 0.0, exterior: 7.74}
  # Carpeta asfáltica de 75 mm sobre 4.00 m de calzada.
  dw: {interior: 3.38, exterior: 1.69}
  # Carga peatonal de 0.370 tf/m2 sobre cada vereda exterior de 1.00 m.
  pl: {interior: 0.0, exterior: 3.63}
trafico:
  camion: {eje_frontal: 35, eje_posterior: 145, separacion_frontal: 4.3, separacion_posterior_min: 4.3, separacion_posterior_max: 9.0}
  tandem_eje: 110
  separacion_tandem: 1.2
  carga_carril: 9.3
  incremento_dinamico: 0.33
  incremento_dinamico_fatiga: 0.15
  adtt_carril: 500
analisis:
  numero_estaciones: 101
  paso_vehiculo: 0.25
  paso_separacion_ejes: 0.30
  tolerancia_equilibrio: 1.0e-8
  limite_deflexion_divisor: 800
  limite_deflexion_vehicular_peatonal_divisor: 1000
  factores:
    servicio_i_ll: 1.00
    servicio_i_pl: 1.00
  metodo_distribucion: parrilla
  parrilla:
    numero_tramos_longitudinales: 20
    paso_posicion_transversal: 0.10
    paso_busqueda_longitudinal: 0.25
    ancho_carril_diseno: 3.0
    separacion_lineas_rueda: 1.80
    factor_presencia_multiple: 1.20
    coeficiente_poisson_concreto: 0.20
    coeficiente_poisson_acero: 0.30
    factor_rigidez_flexion_transversal: 1.0
    factor_rigidez_torsional: 1.0
    puntos_integracion_carga_carril: 5
busqueda: {habilitada: false}
validaciones_externas: {conectores_confirmados: true, rigidizadores_confirmados: true, arriostramiento_confirmado: true}
fuentes:
  geometria: metrado_cargas/registro_verificacion_datos_3.1_a_3.4.md
  seccion: memoria_estructuras/anexo_2_vigas_metalicas.pdf
  cargas_vigas: analisis_superestructura/documentos/vigas_principales/memoria_metrado_manual_cargas_molinohuayco.md
  normativa: normativa/manual_puentes_MTC_2018.pdf
estados_datos:
  geometria: pendiente
  secciones: pendiente
  cargas: calculado
