[project]
name = "zapata-molinohuaico"
version = "0.1.0"
description = "Diseno estructural de zapata izquierda - Puente Molinohuaico"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest", "scipy>=1.13,<2"]

[tool.pytest.ini_options]
testpaths = ["tests", "analisis_estabilidad/pruebas"]
